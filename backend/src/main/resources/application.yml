spring:
  application:
    name: procureflow
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/procureflow}
    username: ${DB_USERNAME:procureflow}
    password: ${DB_PASSWORD:procureflow}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
      refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
      issuer: procureflow
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
