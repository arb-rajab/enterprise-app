services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-procureflow}
      POSTGRES_USER: ${DB_USERNAME:-procureflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-procureflow}
    ports:
      - '5432:5432'
    volumes:
      - procureflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-procureflow}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Local, open-source OIDC provider for the SSO login path - see
  # docs/project-memory/adr/0005-oidc-sso-identity-linking.md and keycloak/README.md. Never a
  # stand-in for a real IdP tenant: it only ever needs to be reachable from `localhost` and this
  # compose network.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ['start-dev', '--import-realm']
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: 'true'
    volumes:
      - ./keycloak/procureflow-realm.json:/opt/keycloak/data/import/procureflow-realm.json:ro
    ports:
      - '8180:8080'
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/localhost/8080 && echo -e "GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q "UP" <&3']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-procureflow}
      DB_USERNAME: ${DB_USERNAME:-procureflow}
      DB_PASSWORD: ${DB_PASSWORD:-procureflow}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file - see .env.example}
      CORS_ALLOWED_ORIGINS: http://localhost:8081
      # The browser only ever knows Keycloak as `localhost:8180` (the authorization endpoint it's
      # redirected to); the backend container reaches the same Keycloak over the compose network
      # as `keycloak:8080` for everything it calls server-to-server (token exchange, JWKS,
      # userinfo). See the comment on `spring.security.oauth2.client.provider.keycloak` in
      # application.yml for why these are configured as separate endpoint URIs instead of one
      # `issuer-uri`.
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-procureflow-dev-secret}
      OIDC_AUTHORIZATION_URI: http://localhost:8180/realms/procureflow/protocol/openid-connect/auth
      OIDC_TOKEN_URI: http://keycloak:8080/realms/procureflow/protocol/openid-connect/token
      OIDC_JWKS_URI: http://keycloak:8080/realms/procureflow/protocol/openid-connect/certs
      OIDC_USERINFO_URI: http://keycloak:8080/realms/procureflow/protocol/openid-connect/userinfo
      OIDC_FRONTEND_REDIRECT_URI: http://localhost:8081/sso/callback
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - '8081:8080'
    depends_on:
      - backend

volumes:
  procureflow-postgres-data:
