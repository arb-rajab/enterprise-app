server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular client-side routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API calls proxy to the backend container. See
    # docs/project-memory/adr/0003-frontend-backend-integration.md for why the frontend never
    # talks to a cross-origin API URL in production.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OIDC login handshake (see docs/project-memory/adr/0008-oidc-sso-identity-linking.md). Kept
    # same-origin for the same ADR-0003 reason /api/ above is, plus: the backend reconstructs its
    # own public base URL (used as the OAuth2 `redirect_uri` it registers with Keycloak) from the
    # inbound Host header, so it must see the port too - $http_host, not $host, preserves it.
    location ~ ^/(oauth2|login)/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
