spring:
  application:
    name: procureflow
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/procureflow}
    username: ${DB_USERNAME:procureflow}
    password: ${DB_PASSWORD:procureflow}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${OIDC_CLIENT_ID:procureflow-backend}
            client-secret: ${OIDC_CLIENT_SECRET:procureflow-dev-secret}
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            redirect-uri: '{baseUrl}/login/oauth2/code/{registrationId}'
            client-name: ProcureFlow SSO (Keycloak)
        provider:
          keycloak:
            # Deliberately NOT `issuer-uri`: that forces one origin for every endpoint, which
            # breaks the moment the browser and the backend can't reach Keycloak by the same
            # hostname (exactly the case in docker-compose, where the browser only knows
            # `localhost:8180` and the backend only knows the `keycloak` service name). Naming
            # each endpoint lets docker-compose.yml override just the backend-internal ones. See
            # docs/project-memory/adr/0008-oidc-sso-identity-linking.md.
            authorization-uri: ${OIDC_AUTHORIZATION_URI:http://localhost:8180/realms/procureflow/protocol/openid-connect/auth}
            token-uri: ${OIDC_TOKEN_URI:http://localhost:8180/realms/procureflow/protocol/openid-connect/token}
            jwk-set-uri: ${OIDC_JWKS_URI:http://localhost:8180/realms/procureflow/protocol/openid-connect/certs}
            user-info-uri: ${OIDC_USERINFO_URI:http://localhost:8180/realms/procureflow/protocol/openid-connect/userinfo}
            user-name-attribute: preferred_username

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
      refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
      issuer: procureflow
  oidc:
    frontend-redirect-uri: ${OIDC_FRONTEND_REDIRECT_URI:http://localhost:4200/sso/callback}
  grpc:
    # Separate listener alongside REST's server.port - see
    # docs/project-memory/adr/0009-grpc-purchase-order-api.md. 0 lets the OS pick a free port
    # (integration tests do this and read the actual bound port back).
    port: ${GRPC_PORT:9090}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
