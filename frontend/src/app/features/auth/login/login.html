<div class="page auth-page">
  <div class="card auth-card">
    <h1>Sign in</h1>
    <p class="muted">
      Demo accounts (password <code>Password123!</code>): admin&#64;procureflow.test,
      manager&#64;procureflow.test, procurement&#64;procureflow.test, finance&#64;procureflow.test,
      employee&#64;procureflow.test
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" />
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password" />
      </div>

      @if (errorMessage()) {
        <p class="error-text">{{ errorMessage() }}</p>
      }

      <button class="btn" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <div class="divider"><span>or</span></div>

    <button type="button" class="btn btn-secondary" (click)="signInWithSso()">Sign in with SSO</button>

    <p class="muted">No account? <a routerLink="/register">Register</a></p>
  </div>
</div>
